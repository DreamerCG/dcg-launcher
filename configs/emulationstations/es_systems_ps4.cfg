<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
        <fullname>PlayStation 4</fullname>
        <name>ps4</name>
        <manufacturer>Sony</manufacturer>
        <release>2013</release>
        <hardware>console</hardware>
        <path>/userdata/roms/ps4</path>
        <extension>.ps4 .config</extension>
        <command>python /userdata/system/dcg/configgen/dcglauncher %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>		
        <platform>ps4</platform>
        <theme>ps4</theme>
        <emulators>
            <emulator name="shadps4">
                <cores>
                    <core default="true">shadps4</core>
                </cores>
            </emulator>
        </emulators>
  </system>  
</systemList>
